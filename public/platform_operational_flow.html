<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Checker - Complete Platform Operational Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background-color: #0b0f17; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .badge { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 9999px; text-transform: uppercase; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #f8fafc; }
    .btn-group { display: flex; gap: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s ease; }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #ffffff; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); }
    .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    main { flex: 1; padding: 2rem; display: flex; justify-content: center; align-items: center; overflow: auto; }
    .diagram-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 1.5rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); max-width: 1440px; width: 100%; }
    svg { width: 100%; height: auto; border-radius: 12px; }
    footer { text-align: center; padding: 1rem; font-size: 12px; color: #64748b; border-top: 1px solid #1e293b; background: #0f172a; }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <span class="badge">Enterprise Deck</span>
      <h1>Event Checker — Complete Platform Operational Flow</h1>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="downloadSVG()">Download SVG</button>
      <button class="btn btn-primary" onclick="downloadPNG()">Download High-Res PNG</button>
    </div>
  </header>
  <main>
    <div class="diagram-card">
      <iframe src="./platform_operational_flow.svg" style="width:100%; height:900px; border:none;"></iframe>
    </div>
  </main>
  <footer>Event Checker Platform © 2026</footer>
  <script>
    function downloadSVG() { window.open('./platform_operational_flow.svg', '_blank'); }
    function downloadPNG() { window.open('./platform_operational_flow.html', '_blank'); }
  </script>
</body>
</html>
