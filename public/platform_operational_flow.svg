<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" style="background-color: #0f172a; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="phase1Header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="phase2Header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="phase3Header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <linearGradient id="phase4Header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="diamondBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="grantedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="deniedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.6" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>

    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <rect width="1400" height="1050" fill="url(#bgGradient)" />

  <g transform="translate(50, 45)">
    <text x="0" y="0" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="0.5">EVENT CHECKER PLATFORM</text>
    <text x="410" y="-2" font-size="22" font-weight="300" fill="#38bdf8">| Complete Platform Operational Flow</text>
    <text x="0" y="24" font-size="13" font-weight="400" fill="#94a3b8">End-to-End Event Setup, Verification Engine, Gate Control &amp; Real-Time Analytics Architecture</text>
  </g>

  <!-- PHASE 1 -->
  <g transform="translate(50, 100)" filter="url(#dropShadow)">
    <rect width="620" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 608 0 Q 620 0 620 12 L 620 40 L 0 40 Z" fill="url(#phase1Header)" />
    <text x="20" y="26" font-size="15" font-weight="700" fill="#ffffff">PHASE 1: Onboarding &amp; Setup</text>

    <g transform="translate(30, 60)">
      <rect width="250" height="45" rx="8" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5" />
      <text x="125" y="27" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Organization Registration</text>
    </g>

    <g transform="translate(340, 60)">
      <rect width="250" height="45" rx="8" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5" />
      <text x="125" y="27" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">SuperAdmin Approval &amp; Audit</text>
    </g>
    <path d="M 280 82.5 L 340 82.5" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />

    <g transform="translate(30, 140)">
      <rect width="250" height="45" rx="8" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5" />
      <text x="125" y="27" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Create Event &amp; Ticket Categories</text>
    </g>
    <path d="M 465 105 L 465 125 L 155 125 L 155 140" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)" />

    <g transform="translate(340, 140)">
      <rect width="250" height="45" rx="8" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5" />
      <text x="125" y="27" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Configure Multi-Gate Security</text>
    </g>
    <path d="M 280 162.5 L 340 162.5" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="30" y="210" width="560" height="65" rx="6" fill="#1e293b" opacity="0.8" stroke="#334155" />
    <text x="45" y="232" font-size="11" font-weight="600" fill="#60a5fa">Key Setup Outputs:</text>
    <text x="45" y="250" font-size="11" fill="#94a3b8">• Multi-tenant workspace activated &amp; custom typography selected</text>
    <text x="45" y="265" font-size="11" fill="#94a3b8">• VIP, Media &amp; General gates isolated with assigned security staff</text>
  </g>

  <!-- PHASE 2 -->
  <g transform="translate(730, 100)" filter="url(#dropShadow)">
    <rect width="620" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 608 0 Q 620 0 620 12 L 620 40 L 0 40 Z" fill="url(#phase2Header)" />
    <text x="20" y="26" font-size="15" font-weight="700" fill="#ffffff">PHASE 2: Attendee Registration &amp; Pass Issuance</text>

    <g transform="translate(30, 60)">
      <rect width="250" height="45" rx="8" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="125" y="27" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Public / Private Invitation Link</text>
    </g>

    <g transform="translate(340, 60)">
      <rect width="250" height="45" rx="8" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="125" y="27" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Attendee RSVP / Registration</text>
    </g>
    <path d="M 280 82.5 L 340 82.5" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)" />

    <g transform="translate(30, 140)">
      <rect width="250" height="45" rx="8" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="125" y="27" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Email Verification &amp; Security</text>
    </g>
    <path d="M 465 105 L 465 125 L 155 125 L 155 140" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow)" />

    <g transform="translate(340, 140)">
      <rect width="250" height="45" rx="8" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="125" y="27" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Unique QR Code Pass Issued</text>
    </g>
    <path d="M 280 162.5 L 340 162.5" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="30" y="210" width="560" height="65" rx="6" fill="#1e293b" opacity="0.8" stroke="#334155" />
    <text x="45" y="232" font-size="11" font-weight="600" fill="#a78bfa">Security Integrity Checks:</text>
    <text x="45" y="250" font-size="11" fill="#94a3b8">• OTP &amp; email validation eliminates spam RSVPs &amp; fake accounts</text>
    <text x="45" y="265" font-size="11" fill="#94a3b8">• Cryptographically signed single-use digital pass generated</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M 360 400 L 360 435 L 700 435 L 700 450" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 1040 400 L 1040 435 L 700 435" stroke="#a78bfa" stroke-width="2.5" fill="none" />

  <!-- PHASE 3 -->
  <g transform="translate(50, 450)" filter="url(#dropShadow)">
    <rect width="1300" height="400" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 1288 0 Q 1300 0 1300 12 L 1300 40 L 0 40 Z" fill="url(#phase3Header)" />
    <text x="20" y="26" font-size="15" font-weight="700" fill="#ffffff">PHASE 3: Gate Operations &amp; Verification Engine</text>

    <g transform="translate(525, 55)">
      <rect width="250" height="45" rx="8" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.5" />
      <text x="125" y="27" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Attendee Arrives at Gate</text>
    </g>

    <path d="M 650 100 L 650 115" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" />

    <g transform="translate(525, 115)">
      <rect width="250" height="45" rx="8" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.5" />
      <text x="125" y="27" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Scanner Dashboard / Scan Pass</text>
    </g>

    <path d="M 650 160 L 650 185" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" />

    <g transform="translate(650, 230)">
      <polygon points="0,-35 150,0 0,35 -150,0" fill="url(#diamondBg)" stroke="#06b6d4" stroke-width="2" />
      <text x="0" y="-5" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">SECURITY VALIDATION</text>
      <text x="0" y="12" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ENGINE</text>
    </g>

    <path d="M 800 230 L 1120 230 L 1120 290" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)" />
    <g transform="translate(980, 290)" filter="url(#glowGreen)">
      <rect width="280" height="60" rx="8" fill="url(#grantedBg)" stroke="#10b981" stroke-width="2" />
      <text x="140" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">🟢 ACCESS GRANTED</text>
      <text x="140" y="44" font-size="11" font-weight="500" fill="#a7f3d0" text-anchor="middle">Valid Pass • Correct Gate • Logged</text>
    </g>

    <path d="M 500 230 L 140 230 L 140 290" stroke="#f43f5e" stroke-width="2" fill="none" marker-end="url(#arrowRed)" />
    <g transform="translate(30, 290)">
      <rect width="220" height="60" rx="8" fill="url(#deniedBg)" stroke="#f43f5e" stroke-width="1.5" />
      <text x="110" y="24" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🔴 DENIED: Wrong Gate</text>
      <text x="110" y="44" font-size="10" fill="#fecdd3" text-anchor="middle">Redirect to correct sector</text>
    </g>

    <path d="M 575 255 L 430 290" stroke="#f43f5e" stroke-width="2" fill="none" marker-end="url(#arrowRed)" />
    <g transform="translate(320, 290)">
      <rect width="220" height="60" rx="8" fill="url(#deniedBg)" stroke="#f43f5e" stroke-width="1.5" />
      <text x="110" y="24" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🔴 DENIED: Duplicate</text>
      <text x="110" y="44" font-size="10" fill="#fecdd3" text-anchor="middle">Pass already scanned</text>
    </g>

    <path d="M 725 255 L 730 290" stroke="#f43f5e" stroke-width="2" fill="none" marker-end="url(#arrowRed)" />
    <g transform="translate(620, 290)">
      <rect width="220" height="60" rx="8" fill="url(#deniedBg)" stroke="#f43f5e" stroke-width="1.5" />
      <text x="110" y="24" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🔴 DENIED: Invalid / Expired</text>
      <text x="110" y="44" font-size="10" fill="#fecdd3" text-anchor="middle">Unverified or revoked pass</text>
    </g>
  </g>

  <!-- Connecting Line -->
  <path d="M 1120 850 L 1120 885 L 700 885 L 700 900" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <!-- PHASE 4 -->
  <g transform="translate(50, 900)" filter="url(#dropShadow)">
    <rect width="1300" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 250 0 L 230 110 L 0 110 Z" fill="url(#phase4Header)" />
    <text x="20" y="50" font-size="15" font-weight="700" fill="#ffffff">PHASE 4:</text>
    <text x="20" y="70" font-size="15" font-weight="700" fill="#ffffff">Analytics &amp; Audit</text>

    <g transform="translate(280, 30)">
      <rect width="450" height="50" rx="8" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5" />
      <text x="225" y="22" font-size="13" font-weight="700" fill="#fef3c7" text-anchor="middle">Live Command Center Dashboard</text>
      <text x="225" y="38" font-size="11" fill="#94a3b8" text-anchor="middle">Real-time gate arrival velocity &amp; peak throughput graphs</text>
    </g>

    <path d="M 730 55 L 780 55" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />

    <g transform="translate(780, 30)">
      <rect width="470" height="50" rx="8" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5" />
      <text x="235" y="22" font-size="13" font-weight="700" fill="#fef3c7" text-anchor="middle">Audit Logs &amp; Report Exporter</text>
      <text x="235" y="38" font-size="11" fill="#94a3b8" text-anchor="middle">One-click PDF &amp; CSV compliance export for stakeholders &amp; law enforcement</text>
    </g>
  </g>
</svg>
